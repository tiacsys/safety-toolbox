# affirmatrix configuration for the safety-toolbox evidence case.
#
# Invocation parameters only: where the case lineage lives, which checkout
# is the implementation, and where the readers find this repository's
# exports. Nothing here enters a hash. Relative paths resolve against this
# file. The readers anchor every hash at a path relative to the named
# repository. The configuration names no test run: a run is given as a
# bundle on the command line.

case: ./case

implementation: toolbox

repositories:
  # This checkout: requirements, implementations and test specifications.
  toolbox: .

producer:
  repository: toolbox
  # The clean documentation build of this checkout at the same commit
  # (exports are reproducible; a build carrying a timestamp is refused).
  requirements:
    export: ../bdoc-toolbox-r6/deploy/html/requirement-specification/needs.json
    types: [top_requirement, requirement]
    source: doc/requirement-specification
  implementations:
    export: ../bdoc-toolbox-r6/deploy/html/api-traceability/needs.json
    doxygen: ../bdoc-toolbox-r6/deploy/xml/dox-safe-data-api
  specifications:
    export: ../bdoc-toolbox-r6/deploy/html/test-specification/needs.json
    doxygen: ../bdoc-toolbox-r6/deploy/xml/dox-safe-data-testspec
