CONFIG_SAFE_DATA=y
CONFIG_LOG=y
CONFIG_SAFE_DATA_LOG_LEVEL_INF=y

CONFIG_SAFE_DATA_CRC32_IEEE=y

# This sample is all about the embedded mutex serialising two threads, so keep
# locking on (the default). No redundant shadow copy is needed here.
CONFIG_SAFE_DATA_LOCKING=y

# Return errors rather than panicking so the sample stays in control.
CONFIG_SAFE_DATA_FAULT_RETURN=y

# Synchronous logging so the output is flushed immediately.
CONFIG_LOG_MODE_IMMEDIATE=y

# Give the cooperative threads real preemption so the producer's deliberately
# widened inconsistency window genuinely overlaps the consumer's reads.
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=1
