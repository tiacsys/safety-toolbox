CONFIG_SAFE_DATA=y
CONFIG_LOG=y
CONFIG_SAFE_DATA_LOG_LEVEL_INF=y

CONFIG_SAFE_DATA_CRC32_IEEE=y

# Keep a redundant inverted shadow copy so a single corrupted copy can be
# recovered instead of trapping.
CONFIG_SAFE_DATA_REDUNDANT=y

# With redundancy on we expect to recover; only a double fault is fatal, and we
# still want an error (not a panic) so the demo can report it.
CONFIG_SAFE_DATA_FAULT_RETURN=y

# Synchronous logging so sample output is flushed immediately.
CONFIG_LOG_MODE_IMMEDIATE=y
