#
# Standalone west manifest for the safe_data module and its documentation.
#
#   west init -m https://github.com/tiacsys/safety-toolbox.git toolbox-ws
#   cd toolbox-ws && west update
#
# The workspace then holds exactly three projects: this repository, Zephyr and the
# zdocs documentation engine. That is all the module, its samples, its twister
# tests and its generated documentation need.

manifest:
  version: "0.13"

  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  self:
    path: safety-toolbox

  projects:
    # Upstream Zephyr at a release tag. safe_data uses only standard kernel,
    # CRC, logging and ztest APIs. No `import:` key: no HAL or other module is
    # needed for native_sim. Without `import:` west does not see Zephyr's own
    # extension commands (build, twister, ...), so they are named here.
    - name: zephyr
      remote: zephyrproject
      revision: v4.4.1
      west-commands: scripts/west-commands.yml

    # The documentation engine (a Zephyr module), public on GitHub. Pinned to a
    # commit, not `main`: the generated documents depend on the engine's exact
    # behaviour. 002682e is the head of the open pull-request stack #4-#9 on
    # tiacsys/zdocs (branch tkaestner/6-coverage-adequacy). It carries the
    # `doxygen_tag:` registry key, the API symbol needs, the Kconfig
    # dependencies and the incremental-rebuild fixes that this repository uses.
    # TODO: when #4-#9 are merged, re-pin to the merge commit on zdocs `main`.
    - name: zdocs
      url: https://github.com/tiacsys/zdocs.git
      revision: 002682eff73bc9a5f2b87559e3b212930f485404
      path: tools/zdocs
