CONFIG_ZTEST=y
CONFIG_SAFE_DATA=y
CONFIG_SAFE_DATA_CRC32_IEEE=y
# No shadow copy: a corrupted payload is an unrecoverable fault.
CONFIG_SAFE_DATA_REDUNDANT=n
# The ISR test lets the assert post action return and records where it fired.
CONFIG_ASSERT=y
CONFIG_ASSERT_TEST=y
CONFIG_IRQ_OFFLOAD=y
# The panic test expects one kernel panic in a helper thread.
CONFIG_ZTEST_FATAL_HOOK=y
